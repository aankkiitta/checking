<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Folders Dashboard</title>
    
    <!-- CSS Yahan Hai -->
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        /* Card Container (Grid Layout) */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Remove default link styling */
        .card-link {
            text-decoration: none;
            color: inherit;
        }

        /* Card Design */
        .card {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        /* Hover Effect */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: #007bff;
            cursor: pointer;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .folder-name {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .folder-date, .folder-type {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Folders</h1>
        
        <div class="card-container">
            
            <!-- Card 1: jai-mari (Updated Link) -->
            <a href="./jai-mari/jmh.html" class="card-link">
                <div class="card">
                    <div class="icon">📁</div>
                    <h2 class="folder-name">jai-mari</h2>
                    <p class="folder-date">06-10-2026 13:09</p>
                    <p class="folder-type">File folder</p>
                </div>
            </a>

            <!-- Card 2: palm (Updated Link) -->
            <a href="./palm/palm.html" class="card-link">
                <div class="card">
                    <div class="icon">📁</div>
                    <h2 class="folder-name">palm</h2>
                    <p class="folder-date">05-10-2026 12:00</p>
                    <p class="folder-type">File folder</p>
                </div>
            </a>

            <!-- Card 3: Elite (Updated Link) -->
            <a href="./Elite/elite.html" class="card-link">
                <div class="card">
                    <div class="icon">📁</div>
                    <h2 class="folder-name">Elite</h2>
                    <p class="folder-date">04-10-2026 13:42</p>
                    <p class="folder-type">File folder</p>
                </div>
            </a>
            
        </div>
    </div>

    <!-- JavaScript Yahan Hai -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Saare cards ko select karein
            const cards = document.querySelectorAll('.card-link');

            // Har card par click event lagayein
            cards.forEach(card => {
                card.addEventListener('click', function(event) {
                    // Folder ka naam nikalein
                    const folderName = this.querySelector('.folder-name').innerText;
                    
                    // Console mein message print karein
                    console.log(`Aapne '${folderName}' folder par click kiya hai.`);
                });
            });
        });
    </script>

</body>
</html>
