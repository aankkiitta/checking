<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tourism Malaysia Card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: #4c9bd7;
      font-family: Arial, Helvetica, sans-serif;
    }

    .project-card {
      --card-width: 270px;

      position: relative;
      width: min(var(--card-width), 90vw);
      margin-top: 28px;
      padding: 164px 14px 0;
      min-height: 195px;
      border-radius: 7px;
      background: linear-gradient(145deg, #ffffff, #f7f7f7);
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.18);
    }

    .project-card__image-wrap {
      position: absolute;
      top: -34px;
      left: 14px;
      right: 14px;
      height: 190px;
      overflow: hidden;
      border-radius: 5px;
      background: #d8e8ee;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .project-card__image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .project-card__title {
      margin: 0;
      padding: 0 0 8px;
      color: #555;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 360px) {
      .project-card {
        padding-top: 164px;
      }

      .project-card__image-wrap {
        height: 180px;
      }
    }
  </style>
</head>

<body>

  <article class="project-card">

    <div class="project-card__image-wrap">
      <img
        class="project-card__image"
        src="./images/tourism-malaysia.jpg"
        alt="Tourism Malaysia"
      >
    </div>

    <h2 class="project-card__title">
      Tourism Malaysia
    </h2>

  </article>

</body>
</html>
